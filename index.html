<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance the Drawer — Decimal Currency Trainer</title>
<style>
html,body{margin:0}
body{background:#efeaf5}
.bd{--ink:#1c1526;--orange:#f47b20;--orangeD:#c2560c;--purple:#6b3fa0;--soft:#fff4e6;--line:#d9cfe6;--good:#1d7a38;--goodbg:#e4f5e9;--bad:#b3261e;--badbg:#fdeceb;--tray:#ece6f4;--slot:#fff;--muted:#5b4d70;
  --spotBill:380px;--spotCoin:190px;--slotH:118px;--slotPic:58px;--btnPic:58px;--fs:19px;--big:56px;
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink);font-size:var(--fs);line-height:1.4;min-height:100vh;background:#efeaf5}
.bd.size-regular{--spotBill:300px;--spotCoin:150px;--slotH:96px;--slotPic:46px;--btnPic:46px;--fs:17px;--big:46px}
.bd.size-xl{--spotBill:460px;--spotCoin:230px;--slotH:140px;--slotPic:70px;--btnPic:70px;--fs:22px;--big:66px}
.bd.adult{--ink:#17202b;--orange:#2f6f9f;--orangeD:#2f6f9f;--purple:#23405e;--soft:#eef4fa;--line:#cfd6e0;--tray:#e8edf3;--muted:#4a5563;font-family:"Segoe UI",Verdana,Arial,sans-serif;background:#f1f4f8}
.bd *{box-sizing:border-box}
.bd [hidden]{display:none!important}
.bd .wrap{max-width:1000px;margin:0 auto;padding:14px 14px 48px}
.bd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bd .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.bd .top h1{margin:0;font-size:calc(var(--fs) * 1.5);color:var(--purple);line-height:1.15}
.bd .he{margin-right:8px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bd .timer{font-weight:700;font-variant-numeric:tabular-nums;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 12px}
.bd .panel{background:#fff;border:3px dashed var(--purple);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.bd.adult .panel{border:2px solid var(--line);border-radius:10px}
.bd h2{margin:0;font-size:calc(var(--fs) * 1.25);color:var(--purple);line-height:1.2}
.bd h2:focus{outline:none}
.bd h3{margin:0 0 6px;font-size:var(--fs);color:var(--purple)}
.bd .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.bd .note{margin:4px 0 10px;color:var(--muted)}
.bd .say{font-size:calc(var(--fs) * 1.1);border:2px solid var(--purple);background:#fff;border-radius:12px;padding:2px 10px;cursor:pointer;line-height:1.3;min-width:48px;min-height:44px;flex:0 0 auto;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bd .say:hover{background:var(--soft)}
.bd button:focus-visible,.bd input:focus-visible{outline:4px solid var(--orange);outline-offset:3px}
.bd .prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;margin:4px 0 10px}
.bd .dots{display:flex;gap:6px}
.bd .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--purple);display:inline-block}
.bd .dots i.on{background:var(--purple)}
.bd .dots i.cur{box-shadow:0 0 0 3px var(--orange)}
/* start */
.bd ol.levels{margin:6px 0 12px;padding-left:28px}
.bd ol.levels li{margin:4px 0}
.bd .namefld{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.bd .namefld label{font-weight:700}
.bd .namefld input{font:inherit;font-size:calc(var(--fs) * 1.1);padding:10px 14px;border:3px solid var(--line);border-radius:12px;min-width:min(320px,100%);flex:1 1 240px;min-height:var(--big)}
.bd .bigbtn{font:inherit;font-weight:700;font-size:calc(var(--fs) * 1.15);border:0;border-radius:16px;padding:12px 26px;cursor:pointer;background:var(--orangeD);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);min-height:var(--big)}
.bd.adult .bigbtn{box-shadow:none;border-radius:10px}
.bd .bigbtn.purple{background:var(--purple)}
.bd .tbtn{font:inherit;font-weight:700;border:3px solid var(--purple);background:#fff;color:var(--purple);border-radius:14px;padding:8px 16px;cursor:pointer;min-height:var(--big)}
.bd.adult .tbtn{border-width:2px;border-radius:10px}
.bd .tbtn:disabled,.bd .bigbtn:disabled{opacity:.4;cursor:not-allowed}
.bd .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
/* feedback */
.bd .fb{border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:700;display:flex;gap:10px;align-items:center;border:3px solid}
.bd .fb.good{background:var(--goodbg);color:var(--good);border-color:#7cc492}
.bd .fb.bad{background:var(--badbg);color:var(--bad);border-color:#e8a19b}
.bd .fb.info{background:var(--soft);color:var(--ink);border-color:#f6c89a}
.bd.adult .fb.info{border-color:#9fb8d1}
.bd .fb .say{border-color:currentColor}
.bd .fb span.t{flex:1}
/* sort level */
.bd .stage{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0}
.bd .spot{background:radial-gradient(ellipse at 50% 40%,#fff 0,#f6f1fb 70%);border:3px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:calc(var(--spotCoin) + 36px);width:min(100%,calc(var(--spotBill) + 40px))}
.bd.adult .spot{background:#fff}
.bd .spot img.bill{width:var(--spotBill);max-width:100%;height:auto;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bd .spot img.coin{width:calc(var(--spotCoin) * var(--rel,1));max-width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.bd .spot.pop img{animation:bdpop .35s ease-out}
@keyframes bdpop{from{transform:scale(.8);opacity:.3}to{transform:none;opacity:1}}
.bd .drawer{background:var(--tray);border:3px solid #b9aed0;border-radius:18px;padding:12px;margin-top:8px}
.bd.adult .drawer{border-color:var(--line)}
.bd .drow{border-radius:14px;padding:6px;margin-bottom:8px}
.bd .drow:last-child{margin-bottom:0}
.bd .drow.glow{box-shadow:0 0 0 4px var(--orange);background:var(--soft)}
.bd .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bd .slotwrap{position:relative}
.bd .slot{font:inherit;width:100%;min-height:var(--slotH);padding-top:30px!important;background:var(--slot);border:3px solid #b9aed0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:8px 6px;color:var(--ink);position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.06)}
.bd .slot:hover:not(:disabled){border-color:var(--purple)}
.bd .slot .plate{font-weight:700;font-size:calc(var(--fs) * 1.2);background:#f3eefa;border:2px solid #b9aed0;border-radius:9px;padding:1px 10px;font-variant-numeric:tabular-nums}
.bd.adult .slot .plate{background:#f4f6f9}
.bd .slot img{max-height:var(--slotPic);max-width:90%;object-fit:contain}
.bd .slot img.ghost{opacity:.25;filter:grayscale(1)}
.bd .slot.done{background:#f3fbf5;border-color:#7cc492;cursor:default}
.bd .slot.done .plate{background:var(--goodbg);border-color:#7cc492;color:var(--good)}
.bd .slot .badge{position:absolute;top:6px;right:8px;font-weight:700;color:var(--good);font-size:calc(var(--fs) * 1.1)}
.bd .slot.nope{border-color:var(--bad);background:var(--badbg);animation:bdshake .35s}
.bd .slot.nope .badge{color:var(--bad)}
.bd .slot.glow{box-shadow:0 0 0 5px var(--orange);border-color:var(--orangeD)}
@keyframes bdshake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bd .slotwrap .say.mini{position:absolute;top:6px;left:6px;font-size:calc(var(--fs) * .85);min-width:38px;min-height:36px;padding:0 6px}
/* change level */
.bd .target{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;background:var(--soft);border:3px solid var(--orange);border-radius:18px;padding:12px 18px;margin:6px 0 10px}
.bd .target:focus{outline:none}
.bd .target .lab{font-weight:700;font-size:calc(var(--fs) * 1.1)}
.bd .target .amt{font-weight:700;font-size:calc(var(--fs) * 2.6);color:var(--purple);font-variant-numeric:tabular-nums;line-height:1}
.bd .tally{display:flex;gap:10px 22px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:calc(var(--fs) * 1.05);margin:4px 0}
.bd .tally .over{color:var(--bad)} .bd .tally .ok{color:var(--good)}
.bd .meter{height:18px;border-radius:9px;background:#e6e0ee;border:2px solid var(--line);overflow:hidden;margin:6px 0 12px}
.bd .meter div{height:100%;background:var(--purple);transition:width .2s}
.bd .meter.full div{background:var(--good)}
.bd .meter.over div{background:repeating-linear-gradient(45deg,var(--bad) 0 10px,#d9534f 10px 20px)}
.bd .tray{min-height:calc(var(--btnPic) + 34px);background:var(--tray);border:3px dashed #b9aed0;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bd .tray .emptytxt{color:var(--muted);padding:6px}
.bd .chip{font:inherit;font-weight:700;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #b9aed0;border-radius:12px;padding:4px 8px;cursor:pointer;min-height:48px}
.bd .chip img{max-height:calc(var(--btnPic) * .7);max-width:calc(var(--btnPic) * 1.4);object-fit:contain}
.bd .chip .x{color:var(--bad);font-size:calc(var(--fs) * .9)}
.bd .chip.glow{box-shadow:0 0 0 4px var(--orange)}
.bd .bank h3{margin-top:12px}
.bd .mbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.bd .mbtn{font:inherit;background:#fff;border:3px solid #b9aed0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:8px 6px;min-height:calc(var(--btnPic) + 52px);color:var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.06)}
.bd .mbtn:hover:not(:disabled){border-color:var(--purple)}
.bd .mbtn:active:not(:disabled){transform:scale(.96)}
.bd .mbtn:disabled{opacity:.45;cursor:not-allowed}
.bd .mbtn img{max-height:var(--btnPic);max-width:92%;object-fit:contain}
.bd .mbtn img.coin{height:calc(var(--btnPic) * 1.25 * var(--rel,1));max-height:none;width:auto}
.bd .mbtn .plate{font-weight:700;font-size:calc(var(--fs) * 1.1);font-variant-numeric:tabular-nums}
.bd .mbtn .nm{font-size:calc(var(--fs) * .8);color:var(--muted)}
.bd .mbtn.glow{box-shadow:0 0 0 5px var(--orange);border-color:var(--orangeD)}
/* finish */
.bd .result{text-align:center}
.bd .result h2{font-size:calc(var(--fs) * 1.6);display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.bd .score{display:inline-flex;flex-direction:column;align-items:center;background:var(--soft);border:3px solid var(--orange);border-radius:18px;padding:10px 26px;margin:8px 0}
.bd .score b{font-size:calc(var(--fs) * 2.6);color:var(--purple);line-height:1.05}
.bd .verdict{font-weight:700;font-size:calc(var(--fs) * 1.15);margin:6px 0}
.bd .verdict.pass{color:var(--good)} .bd .verdict.fail{color:var(--bad)}
.bd ul.lines{list-style:none;padding:0;margin:8px 0;text-align:center}
.bd ul.lines li{margin:3px 0}
.bd .sendbox{text-align:left;margin-top:12px;border-top:2px solid var(--line);padding-top:12px}
.bd .sendbox .acts{justify-content:center}
.bd .msg{text-align:center;font-weight:700;min-height:1.4em;color:var(--good)}
.bd details{margin-top:10px;text-align:left}
.bd details summary{cursor:pointer;font-weight:700;color:var(--purple)}
.bd pre.rep{white-space:pre-wrap;word-break:break-all;background:#f8f6fb;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;max-height:260px;overflow:auto}
.bd .sent{background:var(--goodbg);color:var(--good);border:2px solid #7cc492;border-radius:12px;padding:10px;font-weight:700;margin:10px 0}
@media (max-width:640px){
  .bd .slots,.bd .mbtns{grid-template-columns:repeat(2,1fr)}
  .bd{--spotBill:min(300px,82vw);--fs:18px}
  .bd .target .amt{font-size:calc(var(--fs) * 2.2)}
}
@media (prefers-reduced-motion:reduce){.bd *{animation:none!important;transition:none!important}}
@media print{
  .bd .acts,.bd .say,.bd .sendbox .acts,.bd .bigbtn,.bd .tbtn{display:none!important}
  .bd details{display:block} .bd details>*{display:block}
  .bd pre.rep{max-height:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function drawerRuntime(CFG){
  'use strict';
  var root = document.getElementById('root');
  function add(el, k){
    if (k == null || k === false) return;
    if (Array.isArray(k)) { k.forEach(function(x){ add(el, x); }); return; }
    el.appendChild(typeof k === 'object' ? k : document.createTextNode(String(k)));
  }
  function h(tag, props){
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'value') el.value = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  var EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}‍️]/gu;
  var F = CFG.look !== 'adult';
  var canSpeak = CFG.readAloud !== 'off' && ('speechSynthesis' in window);
  var auto = canSpeak && CFG.readAloud === 'auto';
  var M = CFG.money, byId = {};
  M.forEach(function(m){ byId[m.id] = m; });
  var BILLS = M.filter(function(m){ return m.type === 'bill'; });
  var COINS = M.filter(function(m){ return m.type === 'coin'; });
  var LEVELS = [];
  if (CFG.levels.sort) LEVELS.push('sort');
  if (CFG.levels.change) LEVELS.push('change');
  if (!LEVELS.length) LEVELS.push('sort');

  function cash(c){ c = Math.round(c); return '$' + Math.floor(c / 100) + '.' + String(c % 100).padStart(2, '0'); }
  function words(t){
    return String(t || '').replace(/\$\s?(\d+)\.(\d{2})/g, function(m, d, c){
      d = +d; c = +c; var p = [];
      if (d) p.push(d + (d === 1 ? ' dollar' : ' dollars'));
      if (c) p.push(c + (c === 1 ? ' cent' : ' cents'));
      return p.length ? p.join(' and ') : '0 dollars';
    }).replace(/×/g, ' times ').replace(EMOJI_RE, ' ').replace(/[✓✗✕↩]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function speak(t){
    try {
      var s = words(t);
      if (!s || !canSpeak) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(s);
      u.rate = +CFG.rate || 0.85;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  var live = h('div', {class:'bd-sr', 'aria-live':'polite', role:'status'});
  document.body.appendChild(live);
  function announce(t){ live.textContent = ''; setTimeout(function(){ live.textContent = words(t); }, 40); }
  function tell(t){ announce(t); if (auto) speak(t); }
  function sayBtn(text, label, cls){
    if (!canSpeak) return null;
    return h('button', {type:'button', class:'say' + (cls ? ' ' + cls : ''), title:'Read aloud', 'aria-label':label || 'Read aloud',
      onclick:function(e){ e.stopPropagation(); speak(typeof text === 'function' ? text() : text); }}, '🔊');
  }
  function shuffle(a){ var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
  function pic(m, alt){
    var st = (m.type === 'coin' && CFG.trueSize) ? '--rel:' + m.rel : null;
    return h('img', {class:m.type, src:m.src, alt:alt || '', draggable:'false', style:st});
  }
  function fmtTime(s){ var m = Math.floor(s / 60), r = s % 60; return m ? m + ' min ' + r + ' sec' : r + ' sec'; }
  function clock(s){ return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function fewest(c){
    var out = [];
    M.slice().sort(function(a, b){ return b.cents - a.cents; }).forEach(function(m){
      var n = Math.floor(c / m.cents);
      if (n > 0) { out.push({m:m, n:n}); c -= n * m.cents; }
    });
    return out;
  }
  function randCents(){
    var max = Math.max(1, Math.round((+CFG.max || 20) * 100));
    if (CFG.kind === 'dollars') { var md = Math.max(1, Math.floor(max / 100)); return (1 + Math.floor(Math.random() * md)) * 100; }
    if (CFG.kind === 'cents') { var mc = Math.min(99, max); return 1 + Math.floor(Math.random() * mc); }
    return 1 + Math.floor(Math.random() * max);
  }

  var name = '';
  var S = null, ticker = null;

  function fresh(){
    var rounds = [];
    if (LEVELS.indexOf('change') >= 0) {
      var n = Math.max(1, Math.min(20, parseInt(CFG.rounds, 10) || 5));
      for (var i = 0; i < n; i++) {
        var t = randCents(), tries = 0;
        while (rounds.length && rounds[rounds.length - 1].target === t && tries++ < 8) t = randCents();
        rounds.push({target:t, tray:[], tries:0, hints:0, shown:false, done:false, glow:null});
      }
    }
    S = {
      screen:'start', li:0, t0:0, secs:0, lock:false, result:null, msg:'',
      sort: LEVELS.indexOf('sort') >= 0 ? {order:shuffle(M.map(function(m){ return m.id; })), i:0, placed:{}, misses:0, hints:0, shown:0, hint:0, fb:null, glowRow:null, glowSlot:null, wrong:null, pop:true,
              per:{}} : null,
      change: rounds.length ? {rounds:rounds, i:0, misses:0, fb:null} : null
    };
  }

  function startTimer(){
    clearInterval(ticker);
    S.t0 = Date.now(); S.secs = 0;
    ticker = setInterval(function(){
      S.secs = Math.floor((Date.now() - S.t0) / 1000);
      var el = document.getElementById('bdTimer');
      if (el) el.textContent = '⏱ ' + clock(S.secs);
    }, 1000);
  }

  /* ---------- render ---------- */
  function render(focusSel){
    var ae = document.activeElement;
    var prevK = ae && ae.getAttribute ? ae.getAttribute('data-k') : null;
    root.innerHTML = '';
    root.className = 'bd size-' + (CFG.size || 'large') + (F ? '' : ' adult');
    var wrap = h('div', {class:'wrap'});
    root.appendChild(wrap);
    wrap.appendChild(h('div', {class:'top'},
      h('h1', null, F ? h('span', {class:'he', 'aria-hidden':'true'}, '💵') : null, CFG.title),
      (CFG.showTimer && S.screen !== 'start' && S.screen !== 'finish') ? h('span', {class:'timer', id:'bdTimer'}, '⏱ ' + clock(S.secs)) : null));
    if (S.screen === 'start') viewStart(wrap);
    else if (S.screen === 'sort') viewSort(wrap);
    else if (S.screen === 'change') viewChange(wrap);
    else if (S.screen === 'between') viewBetween(wrap);
    else viewFinish(wrap);
    var t = focusSel ? root.querySelector(focusSel) : (prevK ? root.querySelector('[data-k="' + prevK + '"]') : null);
    if (t && t.disabled) t = root.querySelector('.slot:not(:disabled), .mbtn:not(:disabled)');
    if (!t && (focusSel || prevK)) t = root.querySelector('h2');
    if (t) { try { t.focus({preventScroll: !focusSel}); } catch (e) { t.focus(); } }
  }

  function levelTitle(kind){
    var n = LEVELS.indexOf(kind) + 1, of = LEVELS.length;
    var base = kind === 'sort' ? 'Put the money in the drawer' : 'Make change';
    return (of > 1 ? 'Level ' + n + ' of ' + of + ': ' : '') + base;
  }
  function fbBox(fb){
    if (!fb) return null;
    var icon = fb.kind === 'good' ? (F ? '⭐' : '✓') : fb.kind === 'bad' ? '✗' : (F ? '💡' : 'ℹ');
    return h('div', {class:'fb ' + fb.kind}, h('span', {'aria-hidden':'true'}, icon), h('span', {class:'t'}, fb.text), sayBtn(fb.text, 'Read this aloud'));
  }
  function dots(total, done, cur){
    var d = h('span', {class:'dots', 'aria-hidden':'true'});
    for (var i = 0; i < total; i++) d.appendChild(h('i', {class:(i < done ? 'on' : '') + (i === cur ? ' cur' : '')}));
    return d;
  }

  /* ---------- start ---------- */
  var DIR_SORT = 'Look at the money. Tap the spot in the drawer where it goes. Bills go in the top row. Coins go in the bottom row.';
  var DIR_CHANGE = 'Give exactly this amount. Tap the money to add it. Tap money in your change to take it out. Then tap Check.';
  function viewStart(wrap){
    var lines = [];
    if (LEVELS.indexOf('sort') >= 0) lines.push('Put each bill and coin in its spot in the cash drawer.');
    if (LEVELS.indexOf('change') >= 0) lines.push('Make change: give the right amount of money, ' + S.change.rounds.length + ' times.');
    var intro = (CFG.instructions ? CFG.instructions + ' ' : '') + lines.map(function(l, i){ return (LEVELS.length > 1 ? 'Level ' + (i + 1) + '. ' : '') + l; }).join(' ');

  /* ---------- level: sort ---------- */
  function viewSort(wrap){
    var st = S.sort, cur = byId[st.order[st.i]];
    var placedN = Object.keys(st.placed).length;
    var panel = h('section', {class:'panel'},
      h('div', {class:'hrow'}, h('h2', {tabindex:'-1'}, levelTitle('sort')), sayBtn(DIR_SORT, 'Read the directions aloud')),
      h('p', {class:'note'}, 'Look at the money. Tap its spot in the drawer.'),

        inner.push(h('span', {class:'plate'}, m.label));

  function perItem(id){ var p = S.sort.per; return p[id] || (p[id] = {m:0, h:0, s:0}); }
  function advanceSort(delay){
    S.lock = true;
    setTimeout(function(){
      var st = S.sort;
      S.lock = false; st.i++; st.hint = 0; st.glowRow = null; st.glowSlot = null; st.wrong = null; st.pop = true;

      st.fb = null;

    }, delay);
  }
  function place(id){
    var st = S.sort;
    if (S.lock || st.placed[id]) return;
    var cur = byId[st.order[st.i]];
    if (id === cur.id) {
      st.placed[id] = true; st.wrong = null; st.glowRow = null; st.glowSlot = null;
      st.fb = {kind:'good', text:(F ? 'Yes! ' : 'Correct. ') + 'That is ' + cur.label + '.'};
      tell(st.fb.text);
      S.lock = true;
      render();
      advanceSort(1100);
    } else {
      st.misses++; perItem(cur.id).m++;
      st.wrong = id;
      var extra = (CFG.hints && perItem(cur.id).m >= 2) ? ' Tap Hint for help.' : '';
      st.fb = {kind:'bad', text:'Not that spot. That spot is for ' + byId[id].label + '. Try again.' + extra};
      tell(st.fb.text);
      render();
    }
  }
  function sortHint(){
    var st = S.sort, cur = byId[st.order[st.i]];
    if (S.lock) return;
    st.hints++; perItem(cur.id).h++; st.wrong = null;
    if (st.hint === 0) {
      st.glowRow = cur.type; st.hint = 1;

    } else {
      st.glowRow = null; st.glowSlot = cur.id;

    tell(st.fb.text);
    render();
  }
  function sortShow(){
    var st = S.sort, cur = byId[st.order[st.i]];
    if (S.lock) return;
    st.shown++; st.misses++; perItem(cur.id).s++;
    st.placed[cur.id] = true; st.wrong = null; st.glowRow = null; st.glowSlot = cur.id;
    st.fb = {kind:'info', text:'Here is where it goes: ' + cur.label + '.'};
    tell(st.fb.text);
    S.lock = true;
    render();
    advanceSort(1800);
  }

  /* ---------- level: make change ---------- */
  function trayTotal(r){ return r.tray.reduce(function(s, id){ return s + byId[id].cents; }, 0); }
  function viewChange(wrap){
    var ch = S.change, r = ch.rounds[ch.i], have = trayTotal(r), diff = r.target - have;
    var panel = h('section', {class:'panel'},
      h('div', {class:'hrow'}, h('h2', {tabindex:'-1'}, levelTitle('change')), sayBtn(DIR_CHANGE, 'Read the directions aloud')),
      h('p', {class:'note'}, 'Tap money to add it. Tap money in your change to take it out. Then tap ✓ Check.'),
      h('div', {class:'prog'}, dots(ch.rounds.length, ch.i + (r.done ? 1 : 0), ch.i), h('span', null, 'Amount ' + (ch.i + 1) + ' of ' + ch.rounds.length)));

      sayBtn(function(){ return 'You have ' + cash(have) + '. ' + (diff > 0 ? 'You still need ' + cash(diff) + '.' : diff === 0 ? 'That is just right.' : 'That is too much by ' + cash(-diff) + '.'); }, 'Hear how much you have')));

    var tray = h('div', {class:'tray', role:'group', 'aria-label':'Your change'});
    if (!r.tray.length) tray.appendChild(h('span', {class:'emptytxt'}, 'Nothing yet. Tap money below to add it.'));
    r.tray.forEach(function(id, k){
      var m = byId[id];
      tray.appendChild(h('button', {type:'button', class:'chip' + (r.glow === 'tray-' + k ? ' glow' : ''), 'data-k':'chip-' + k, disabled:r.done || null,
        'aria-label':'Take out ' + m.label, onclick:function(){ takeOut(k); }}, pic(m), h('span', null, m.label), r.done ? null : h('span', {class:'x', 'aria-hidden':'true'}, '✕')));
    });
    panel.appendChild(h('h3', null, 'Your change'));
    panel.appendChild(tray);
    add(panel, fbBox(ch.fb));
    var acts = h('div', {class:'acts'});
    if (r.done) {
      var last = ch.i >= ch.rounds.length - 1;
      acts.appendChild(h('button', {type:'button', class:'bigbtn', 'data-k':'next', onclick:nextRound}, last ? (LEVELS[S.li + 1] ? 'Next level ▶' : 'See my results ▶') : 'Next amount ▶'));
    } else {
      acts.appendChild(h('button', {type:'button', class:'bigbtn', 'data-k':'check', onclick:check}, '✓ Check'));
      acts.appendChild(h('button', {type:'button', class:'tbtn', 'data-k':'undo', onclick:undo, disabled:!r.tray.length || null}, '↩ Take back last'));
      acts.appendChild(h('button', {type:'button', class:'tbtn', 'data-k':'clear', onclick:clearTray, disabled:!r.tray.length || null}, '✕ Clear'));
      if (CFG.hints) acts.appendChild(h('button', {type:'button', class:'tbtn', 'data-k':'hint', onclick:changeHint}, '💡 Hint'));
      if (CFG.showAnswer) acts.appendChild(h('button', {type:'button', class:'tbtn', 'data-k':'show', onclick:changeShow}, '👀 Show me'));
    }
    panel.appendChild(acts);
    var bank = h('div', {class:'bank', role:'group', 'aria-label':'Money to give'});
    function brow(list, label){
      bank.appendChild(h('h3', null, label));
      var g = h('div', {class:'mbtns'});
      list.forEach(function(m){
        g.appendChild(h('button', {type:'button', class:'mbtn' + (r.glow === 'add-' + m.id ? ' glow' : ''), 'data-k':'add-' + m.id, disabled:r.done || null,
          'aria-label':'Add ' + m.label + (m.name ? ', ' + m.name : ''), onclick:function(){ addMoney(m.id); }},
          pic(m), h('span', {class:'plate'}, m.label), CFG.names && m.name ? h('span', {class:'nm'}, m.name) : null));
      });
      bank.appendChild(g);
    }
    brow(BILLS, F ? '💵 Bills' : 'Bills');
    brow(COINS, F ? '🪙 Coins' : 'Coins');
    panel.appendChild(bank);
    wrap.appendChild(panel);
  }
  function curRound(){ return S.change.rounds[S.change.i]; }
  function addMoney(id){
    var r = curRound(); if (r.done) return;
    r.tray.push(id); r.glow = null; S.change.fb = null;
    var m = byId[id], have = trayTotal(r);
    announce(m.label + ' added. You have ' + cash(have) + '.');
    if (auto) speak(m.label + '. You have ' + cash(have) + '.'); else if (canSpeak) speak(m.label);
    render();
  }
  function takeOut(k){
    var r = curRound(); if (r.done) return;
    var m = byId[r.tray[k]];
    r.tray.splice(k, 1); r.glow = null; S.change.fb = null;
    var msg = 'Took out ' + m.label + '. You have ' + cash(trayTotal(r)) + '.';
    announce(msg); if (canSpeak) speak(msg);
    render(r.tray.length ? '[data-k="chip-' + Math.min(k, r.tray.length - 1) + '"]' : '[data-k="add-' + m.id + '"]');
  }
  function undo(){ var r = curRound(); if (!r.tray.length) return; takeOut(r.tray.length - 1); }
  function clearTray(){
    var r = curRound(); r.tray = []; r.glow = null; S.change.fb = null;
    tell('Cleared. You have 0 dollars.');
    render('[data-k="check"]');
  }
  function check(){
    var ch = S.change, r = curRound(), have = trayTotal(r);
    if (!r.tray.length) { ch.fb = {kind:'info', text:'Add some money first. Tap the bills and coins below.'}; tell(ch.fb.text); render(); return; }
    r.tries++;
    if (have === r.target) {
      r.done = true; r.glow = null;
      ch.fb = {kind:'good', text:(F ? 'Correct! Great job. ' : 'Correct. ') + 'You gave exactly ' + cash(r.target) + '.'};
      tell(ch.fb.text);
      render('[data-k="next"]');
    } else {
      ch.misses++;
      ch.fb = have < r.target
        ? {kind:'bad', text:'Not yet. You gave ' + cash(have) + '. You need ' + cash(r.target - have) + ' more.'}
        : {kind:'bad', text:'Too much. You gave ' + cash(have) + '. That is ' + cash(have - r.target) + ' too much. Take some out.'};
      tell(ch.fb.text);
      render();

  function changeHint(){
    var ch = S.change, r = curRound(), have = trayTotal(r), diff = r.target - have;

      var m = M.slice().sort(function(a, b){ return b.cents - a.cents; }).filter(function(x){ return x.cents <= diff; })[0];
      r.glow = 'add-' + m.id;
      ch.fb = {kind:'info', text:'Hint: You still need ' + cash(diff) + '. Try adding ' + (m.name ? 'a ' + m.name.toLowerCase() + ', ' : '') + m.label + '.'};
    } else if (diff < 0) {
      var idx = -1, best = -1;
      r.tray.forEach(function(id, k){ var c = byId[id].cents; if (c > best) { best = c; idx = k; } });
      r.glow = 'tray-' + idx;
      ch.fb = {kind:'info', text:'Hint: That is too much. Take out the ' + byId[r.tray[idx]].label + ' and try again.'};
    } else {
      r.glow = null;
      ch.fb = {kind:'info', text:'Hint: That is the right amount! Tap Check.'};
    }
    tell(ch.fb.text);
    render();
  }
  function changeShow(){
    var ch = S.change, r = curRound();
    r.shown = true; ch.misses++; r.done = true; r.glow = null;
    var parts = fewest(r.target);
    r.tray = [];
    parts.forEach(function(p){ for (var i = 0; i < p.n; i++) r.tray.push(p.m.id); });
    ch.fb = {kind:'info', text:'Here is one way to give ' + cash(r.target) + ': ' + parts.map(function(p){ return p.n + ' × ' + p.m.label; }).join(', ') + '.'};

    render('[data-k="next"]');
  }
  function nextRound(){
    var ch = S.change;

    render('[data-k="target"]');
    tell('Amount ' + (ch.i + 1) + '. Give ' + cash(curRound().target) + '.');
  }

  /* ---------- finish ---------- */
  function encode(o){ return 'BTD1:' + btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
  function finish(){
    clearInterval(ticker);
    S.secs = Math.max(S.secs, Math.floor((Date.now() - S.t0) / 1000));
    var st = S.sort, ch = S.change;
    var steps = (st ? M.length : 0) + (ch ? ch.rounds.length : 0);
    var misses = (st ? st.misses : 0) + (ch ? ch.misses : 0);
    var acc = steps ? Math.round(steps / (steps + misses) * 100) : 0;
    var pr = +CFG.passRate || 80;
    var pass = acc >= pr;
    var who = name.trim() || 'Student';
    var when = new Date();
    var raw = who + '|' + acc + '|' + misses + '|' + S.secs + '|' + when.toISOString() + '|DRAWER_SIG';
    var hh = 0; for (var i = 0; i < raw.length; i++) hh = ((hh << 5) - hh) + raw.charCodeAt(i) | 0;
    var proof = 'PRF-' + Math.abs(hh).toString(16).toUpperCase().padStart(8, '0') + '-' + when.getTime().toString(36).toUpperCase().slice(-4);
    var data = {v:1, n:who, a:CFG.title, at:when.toISOString(), s:S.secs, acc:acc, pr:pr, pass:pass ? 1 : 0, pc:proof,
      L1: st ? {m:st.misses, h:st.hints, sh:st.shown, it:st.per} : null,
      L2: ch ? {m:ch.misses, r:ch.rounds.map(function(r){ return [r.target, r.tries, r.hints, r.shown ? 1 : 0]; })} : null};
    var code = encode(data);
    var lines = [];
    lines.push('Balance the Drawer results');
    lines.push('Student: ' + who);
    lines.push('Activity: ' + CFG.title);
    lines.push('Date: ' + when.toLocaleString());
    lines.push('Time: ' + fmtTime(S.secs));
    if (st) lines.push('Level: Put the money in the drawer: ' + M.length + ' of ' + M.length + ' placed, ' + st.misses + (st.misses === 1 ? ' miss, ' : ' misses, ') + st.hints + (st.hints === 1 ? ' hint, ' : ' hints, ') + st.shown + ' shown');
    if (ch) {
      var first = ch.rounds.filter(function(r){ return r.tries === 1 && !r.shown; }).length;
      lines.push('Level: Make change: ' + ch.rounds.length + ' amounts, ' + first + ' right on the first try, ' + ch.misses + (ch.misses === 1 ? ' miss' : ' misses'));
      ch.rounds.forEach(function(r, k){ lines.push('   ' + (k + 1) + '. ' + cash(r.target) + ': ' + (r.shown ? 'shown' : r.tries === 1 ? 'right first try' : 'right after ' + r.tries + ' tries') + (r.hints ? ', ' + r.hints + ' hint' + (r.hints > 1 ? 's' : '') : '')); });
    }
    lines.push('Score: ' + acc + '% (pass mark ' + pr + '%): ' + (pass ? 'PASSED' : 'NEEDS MORE PRACTICE'));
    lines.push('Proof code: ' + proof);
    lines.push('');
    lines.push('Results code (staff: paste into the Results page):');
    lines.push(code);
    S.result = {acc:acc, pass:pass, pr:pr, misses:misses, code:code, report:lines.join('\n'), who:who, proof:proof};

    render('h2');
    var head = F ? 'You balanced the drawer!' : 'All done.';
    if (CFG.showScore) head += ' Your score is ' + acc + ' percent.';
    if (auto) speak(head + ' Now send your results to your teacher.');
  }
